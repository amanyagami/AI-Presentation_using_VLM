[project]
name = "slidegen"
version = "0.1.0"
description = "Extract figures and text from research PDFs and generate slide JSON with a vision-language model."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=10.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
ocr = ["paddleocr", "paddlepaddle"]
vlm = ["anthropic>=0.40"]

[project.scripts]
slidegen = "slidegen.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slidegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "E741"]
